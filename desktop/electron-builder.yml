appId: com.moon.batchprinter
productName: BatchPrinter
copyright: Copyright © 2026 moon

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: vendor/sumatra
    to: vendor/sumatra
    filter:
      - "**/*"

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 批量打印助手
  artifactName: ${productName}-${version}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-portable.${ext}
