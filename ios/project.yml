name: BatchPrinterIOS
options:
  bundleIdPrefix: com.moon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: 75L84BV98K
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BatchPrinterIOS:
    type: application
    platform: iOS
    sources:
      - path: BatchPrinterIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moon.batchprinter.ios
        PRODUCT_NAME: BatchPrinter
        INFOPLIST_FILE: BatchPrinterIOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: BatchPrinterIOS/BatchPrinterIOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ShareExtension

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: BatchPrinterIOS/Services/InboxStore.swift
      - path: BatchPrinterIOS/Models/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moon.batchprinter.ios.share
        PRODUCT_NAME: ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

schemes:
  BatchPrinterIOS:
    build:
      targets:
        BatchPrinterIOS: all
        ShareExtension: all
    run:
      config: Debug
